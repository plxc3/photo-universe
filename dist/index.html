<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Memoria，照片的立体空间。导入你的相册，探索星环与旋转隧道。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/newsreader-latin-italic-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Memoria — 记忆的形状</title>
    <script type="module" crossorigin src="/assets/index-BaetHuu7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CcI5u5me.css">
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="三维照片空间。拖动旋转，滚轮或双指缩放，点击照片放大。"></div>
      <header class="topbar chrome">
        <h1 class="brand"><button id="brand" aria-label="Memoria，重置视角">Memoria</button></h1>
        <button id="collection" class="collection-button" aria-label="浏览相册"><i data-lucide="grid-2x2" aria-hidden="true"></i><span id="photo-count" aria-live="polite">正在载入</span></button>
        <div class="top-actions">
          <button class="import-button" id="import"><i data-lucide="plus" aria-hidden="true"></i><span>导入照片</span></button>
          <button class="icon-button" id="help" aria-label="使用说明" title="使用说明"><i data-lucide="info" aria-hidden="true"></i></button>
        </div>
      </header>
      <span class="sr-only" id="particle-count"></span>
      <span class="sr-only" id="mode-name" aria-live="polite">星环</span>
      <footer class="bottom-bar chrome">
        <nav class="mode-selector" aria-label="照片形态">
          <button data-mode="orbit" aria-pressed="true">星环</button><button data-mode="tunnel" aria-pressed="false">隧道</button><button data-mode="sphere" aria-pressed="false">星球</button><button data-mode="helix" aria-pressed="false">螺旋</button>
        </nav>
        <div class="film-actions">
          <button class="icon-button" id="play" aria-label="暂停旋转" title="暂停旋转"><i data-lucide="pause" aria-hidden="true"></i></button>
          <button id="film" class="tour-button"><i data-lucide="play" aria-hidden="true"></i><span>30 秒漫游</span></button>
          <button id="record" class="icon-button" aria-label="录制 30 秒视频" title="录制 30 秒视频"><i data-lucide="download" aria-hidden="true"></i></button>
          <button id="settings" class="icon-button" aria-label="视图设置" title="视图设置"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></button>
        </div>
      </footer>
      <div class="loader" id="loader" role="status"><span class="loader-orbit"></span><span id="loading-text">正在整理照片</span><progress id="loading-progress" max="100" value="0"></progress></div>
      <div class="drop-target" id="drop-target"><i data-lucide="plus" aria-hidden="true"></i><span>放入你的照片</span><p>最多 3,000 张</p></div>
      <div class="error-card" id="error-card" hidden><h2>暂时无法打开空间</h2><p id="error-message"></p><button class="button" id="retry">重新打开</button><button class="button" id="browse-fallback">浏览相册</button></div>
      <div class="film-status" id="film-status" hidden><span id="film-description">漫游</span><span id="film-time">00:00 / 00:30</span><button id="stop-film" class="icon-button" aria-label="结束漫游"><i data-lucide="x" aria-hidden="true"></i></button><progress id="film-progress" value="0" max="30"></progress></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <button id="restore-ui" class="button" hidden><i data-lucide="eye" aria-hidden="true"></i><span>显示界面</span><kbd>H</kbd></button>
      <input type="file" id="file-input" accept="image/*,.heic,.heif" multiple hidden />
      <dialog id="gallery-dialog" aria-labelledby="gallery-title">
        <div class="gallery-header"><h2 id="gallery-title">相册</h2><button class="dialog-close icon-button" aria-label="关闭相册"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <div id="gallery-grid" class="gallery-grid"></div>
        <div class="gallery-pagination"><span id="gallery-range"></span><div><button id="gallery-previous" class="icon-button" aria-label="上一页照片"><i data-lucide="arrow-left" aria-hidden="true"></i></button><button id="gallery-next" class="icon-button" aria-label="下一页照片"><i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div>
      </dialog>
      <dialog id="photo-dialog" aria-label="照片放大查看">
        <button class="dialog-close icon-button" aria-label="关闭照片"><i data-lucide="x" aria-hidden="true"></i></button>
        <div id="photo-stage" class="photo-stage" aria-busy="false">
          <img id="photo-preview" alt="" hidden />
          <div id="photo-feedback" class="photo-feedback" role="status" hidden><span class="loader-orbit" aria-hidden="true"></span><span id="photo-status">正在打开照片</span><button id="photo-retry" class="button" hidden>重新打开照片</button></div>
        </div>
        <div class="photo-caption" aria-live="polite" aria-atomic="true"><span id="photo-title"></span><span id="photo-number"></span></div>
        <div class="photo-navigation"><button class="icon-button" id="previous-photo" aria-label="上一张照片"><i data-lucide="arrow-left" aria-hidden="true"></i></button><button class="icon-button" id="next-photo" aria-label="下一张照片"><i data-lucide="arrow-right" aria-hidden="true"></i></button></div>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <button class="dialog-close icon-button" aria-label="关闭设置"><i data-lucide="x" aria-hidden="true"></i></button>
        <h2 id="settings-title">视图设置</h2>
        <label class="speed-row" for="speed"><span>旋转速度</span><input id="speed" type="range" min="0.2" max="2" value="0.45" step="0.05" aria-label="旋转速度" /></label>
        <div class="settings-actions"><button id="reset"><i data-lucide="rotate-ccw" aria-hidden="true"></i>重置视角</button><button id="clean"><i data-lucide="eye-off" aria-hidden="true"></i>隐藏界面<kbd>H</kbd></button><button id="fullscreen"><i data-lucide="maximize" aria-hidden="true"></i><span>进入全屏</span></button></div>
      </dialog>
      <dialog id="help-dialog" aria-labelledby="help-title">
        <button class="dialog-close icon-button" aria-label="关闭说明"><i data-lucide="x" aria-hidden="true"></i></button>
        <h2 id="help-title">慢慢探索。</h2>
        <p>拖动旋转，滚轮或双指缩放。点击照片放大，也可以从顶部相册浏览。</p>
        <p>导入或拖入最多 3,000 张照片。照片留在当前浏览器，刷新后恢复精选相册。HEIC 请先转为 JPG。</p>
        <div class="help-shortcuts"><span><kbd>空格</kbd> 暂停</span><span><kbd>H</kbd> 隐藏界面</span><span><kbd>Esc</kbd> 结束漫游</span></div>
        <button id="demo" class="button">恢复精选相册</button>
        <div class="help-links"><a href="./editorial/SOURCES.md" target="_blank" rel="noreferrer">摄影来源</a><a href="https://www.douyin.com/video/7692616221573117321" target="_blank" rel="noreferrer">参考作品<i data-lucide="arrow-up-right" aria-hidden="true"></i></a></div>
      </dialog>
      <aside id="inspection-panel" hidden aria-label="动效验收"><div class="inspection-actions"><button id="sample-performance">采样 30 秒</button><button id="stop-performance">结束采样</button><button data-inspect-seek="8">镜头 8 秒</button><button data-inspect-seek="14">镜头 14 秒</button><button data-inspect-seek="25">镜头 25 秒</button></div><output id="performance-output">等待采样</output></aside>
      <noscript><div class="no-script">需要启用 JavaScript 才能打开照片空间。<a href="./editorial/coast-analogue.jpg">查看摄影</a></div></noscript>
    </main>
  </body>
</html>
